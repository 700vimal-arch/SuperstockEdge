app:
  name: Superstock Edge
  version: 0.4.0
  timezone: Asia/Kolkata

universe:
  cache_ttl_days: 7
  max_scan_symbols: 500
  batch_size: 50
  fundamentals_top_n: 25

markets:
  india:
    currency: INR
    suffix: .NS
    symbols: [RELIANCE.NS, TRENT.NS, KAYNES.NS, DIXON.NS, BSE.NS, ETERNAL.NS]
  us:
    currency: USD
    symbols: [AAPL, NVDA, PLTR, APP, HOOD, SOFI]

scanner:
  minimum_history_weeks: 40
  base_min_weeks: 10
  base_max_weeks: 26
  base_max_range_pct: 35
  volume_expansion_multiple: 2.0
  quiet_volume_multiple: 0.75
  quiet_atr_multiple: 0.85
  quiet_magic_distance_pct: 5.0
  magic_break_buffer_pct: 2.0
  extended_threshold_pct: 60
  parabolic_runup_40w_pct: 100
  parabolic_extension_pct: 35
  max_trailing_pe: 40
  earnings_wait_weeks: 2
  magic_line:
    auto_select: true
    forced_method: null
    candidates: ["10W SMA", "10W EMA", "20W SMA", "20W EMA"]
    min_tests: 3
    min_resolved_tests: 2
    min_successes: 1
    min_defined_bars: 30
    test_tolerance_pct: 2.5
    test_close_tolerance_pct: 1.5
    min_separation_weeks: 4
    recovery_window_weeks: 4
    recovery_threshold_pct: 3.0
    breakdown_buffer_pct: 2.0
  entry:
    zone_width_pct: 2.5
    max_entry_distance_pct: 8.0
    swing_lookback_weeks: 8
    atr_stop_multiple: 2.0
    min_stop_atr: 0.75
    stop_buffer_atr: 0.25
    min_stop_pct: 1.0
    max_stop_pct: 12.0
    pe_scenarios:
      conservative: 12
      base: 20
      optimistic: 30

risk:
  risk_per_trade_pct: 0.5
  max_position_pct: 10
  max_portfolio_risk_pct: 3
  atr_stop_multiple: 2.0

backtest:
  initial_capital: 100000
  commission_bps: 10
  slippage_bps: 10
  max_positions: 10
